name: Build

on:
  push:
    paths-ignore:
      - '*.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_SDK_ROOT/build-tools/35.0.1:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          
          yes | sdkmanager --licenses
          
          sdkmanager --verbose --install "platforms;android-29"
          
          APK_NAME="framework-res__auto_generated_rro"
          
          aapt2 compile --dir res -o compiled_resources.zip
          aapt2 link -v -o ${APK_NAME}-unaligned.apk -I $ANDROID_SDK_ROOT/platforms/android-29/android.jar --manifest AndroidManifest.xml --min-sdk-version 29 --target-sdk-version 29 compiled_resources.zip
          
          zipalign -v 4 ${APK_NAME}-unaligned.apk ${APK_NAME}.apk
          apksigner sign -v --v1-signing-enabled false --key testdata/testkey.pk8 --cert testdata/testkey.x509.pem ${APK_NAME}.apk
          rm -f -v ${APK_NAME}-unaligned.apk compiled_resources.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ta2cm8-overlay-customized
          path: framework-res__auto_generated_rro.apk
